workflows:
  android-apk:
    name: Android APK (Mourad's Ville Omega)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
      vars:
        JAVA_TOOL_OPTIONS: "-Xmx4g"
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps

      - name: Build web assets (static bundle for Capacitor)
        script: npm run build:mobile

      - name: Generate native Android icons from public folder
        script: |
          mkdir -p assets
          cp public/icon.png assets/logo.png
          cp public/icon.png assets/icon-only.png
          npm install -D @capacitor/assets
          npx @capacitor/assets generate --android

      - name: Sync Capacitor Android project
        script: npx cap sync android

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - kirakill25@users.noreply.github.com
        notify:
          success: true
          failure: true
